<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vellibris</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="icon" href="favicon.ico" sizes="any">
    <!-- Theme/font before CSS + React — keys must match THEME_KEY / FONT_KEY in engine/storage -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          root.classList.add('theme-bootstrapping');
          if (localStorage.getItem('ms_theme') === 'light') root.classList.add('light');
          var fs = localStorage.getItem('ms_font');
          if (fs) {
            var n = parseInt(fs, 10);
            if (n) root.style.setProperty('--body-size', n + 'px');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
